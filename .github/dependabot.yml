version: 2

# skyphusion-labs Dependabot standard — see fleet-chezmoi/docs/runbooks/dependabot-standard.md
# PRs only (never auto-merge). Group minor/patch; majors stay separate.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # Majors that stay ignored:
    # - gradle 10. The wrapper is 9.8.0, paired with AGP 9.4.1. AGP 8.x uses
    #   InternalProblems, which Gradle 9.6 removed, so the wrapper cannot move alone.
    # - billing-ktx 9 changes queryProductDetailsAsync to QueryProductDetailsResult
    # - AGP 10. 9.4.1 is the compileSdk 37 line (API 37 needs AGP >= 9.1.1, and
    #   9.4.1 is the current stable whose minimum Gradle is 9.6).
    # - bouncycastle 1.85.2 is not published (latest jdk18on is 1.85); #50 then #52
    ignore:
      - dependency-name: "gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.billingclient:billing-ktx"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.bouncycastle:bcprov-jdk18on"
        versions: ["1.85.2"]
      - dependency-name: "org.bouncycastle:bcpkix-jdk18on"
        versions: ["1.85.2"]
      - dependency-name: "org.bouncycastle:bcutil-jdk18on"
        versions: ["1.85.2"]
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
